name: deploy

# main 分支 → 生产环境（golder-cli.pages.dev）
# PR        → 预览环境（<branch>.golder-cli.pages.dev）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name golder-cli
            --branch ${{ github.event_name == 'push' && 'main' || github.head_ref }}

      - name: Report deployment URL
        run: echo "deployed: ${{ steps.deploy.outputs.deployment-url }}"

      - name: Assert project subdomain is the bare golder-cli.pages.dev
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 名字被占时 Cloudflare 会静默给项目加随机前缀（如 d067e90f.golder-cli.pages.dev）。
          # 这里直接问 API 要权威答案，防止"以为占到了名字"。
          subdomain=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/golder-cli" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain')
          echo "project subdomain: $subdomain"
          if [ "$subdomain" != "golder-cli.pages.dev" ]; then
            echo "::error::unexpected subdomain '$subdomain' (expected golder-cli.pages.dev — name collision?)"
            exit 1
          fi
