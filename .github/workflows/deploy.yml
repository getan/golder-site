name: deploy

# main 分支 → 生产环境（golder-cli.pages.dev）
# PR        → 预览环境（<branch>.golder-cli.pages.dev）
# 未配置 CLOUDFLARE_* secrets 时只构建、跳过部署，CI 保持绿色。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Mirror install.sh from the main repo
        run: |
          # 把主仓库的安装脚本原样镜像到站点根路径 /install.sh，
          # 缓解大陆访问 raw.githubusercontent.com 不稳定的问题。
          # 同一份源码、同一个正式 Release；脚本自身带 sha256 校验。
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/getan/golder/master/install.sh" \
            -o dist/install.sh
          head -n 1 dist/install.sh | grep -q '^#!/bin/sh' \
            || { echo "::error::install.sh 内容异常（首行不是 #!/bin/sh）"; exit 1; }
          # 记录指纹，便于与主仓库对照
          echo "install.sh sha256: $(sha256sum dist/install.sh | cut -d' ' -f1)"

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets 未配置，跳过部署（见 README「首次配置」）"
          fi

      - name: Ensure Pages production branch is main
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Dashboard 直传项目若 production_branch 不是 main，--branch main 的部署
          # 会落到 preview 环境、生产 URL 不更新；这里校正一次（幂等操作）。
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/golder-cli"
          current=$(curl -fsS "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.production_branch')
          echo "production_branch: $current"
          if [ "$current" != "main" ]; then
            curl -fsS -X PATCH "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"production_branch":"main"}' > /dev/null
            echo "updated production_branch -> main"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name golder-cli
            --branch ${{ github.head_ref || 'main' }}

      - name: Report deployment URL
        if: steps.cf.outputs.configured == 'true'
        run: |
          echo "deployed: ${{ steps.deploy.outputs.deployment-url }}"

      - name: Assert project subdomain is the bare golder-cli.pages.dev
        if: github.event_name == 'push' && steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 名字被占时 Cloudflare 会静默给项目加随机前缀（如 d067e90f.golder-cli.pages.dev）。
          # 这里直接问 API 要权威答案，防止"以为占到了名字"。
          subdomain=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/golder-cli" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain')
          echo "project subdomain: $subdomain"
          if [ "$subdomain" != "golder-cli.pages.dev" ]; then
            echo "::error::unexpected subdomain '$subdomain' (expected golder-cli.pages.dev — name collision?)"
            exit 1
          fi
